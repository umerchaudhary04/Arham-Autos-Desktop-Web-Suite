name: arham_autos
description: Arham Autos POS & Management System
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.0
  path: ^1.8.3
  flutter_secure_storage: ^9.0.0
  cryptography: ^2.5.0
  flutter_riverpod: ^3.0.0-dev.2
  go_router: ^12.0.0
  file_selector: ^0.9.3
  pdf: ^3.10.0
  printing: ^5.11.0
  intl: ^0.20.2
  uuid: ^4.0.0
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.35.0
  build_runner: ^2.4.0
  flutter_lints: ^3.0.0
  fake_async: ^1.3.1
  mocktail: ^1.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/

dependency_overrides:
  meta: ^1.18.3
